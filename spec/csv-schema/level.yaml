name: level

fields:
  - name: id
    type: string
    required: true

  - name: number
    type: string
    required: true

  - name: name
    type: string

  - name: elevation
    type: float
    required: true

  - name: usage
    type: string
    description: Optional engineering role such as residential, roof-datum or other. Review rule applicability separately.

  - name: elevation_basis
    type: string
    description: Optional datum convention. Use architectural-finish for the architectural finished-floor datum or structural for a structural datum.

  - name: upper_level_id
    type: string
    description: Optional proposed upper datum from the same level table. Requires review and an elevation above this datum.

  - name: elevation_source
    type: string
    description: Optional source of the elevation basis and proposed pairing.
