name: property_area
version: 1
description: Reviewed project-side evidence for the Shanghai 2022 single-building residential difference method.
file: property_area.json
profile: sh-property-2022-single-building
source: 沪房市场〔2022〕49号附件 1.2.1、1.2.2、3.3.1、3.3.2、3.3.3（1）
fields:
  version: "1"
  profile: "sh-property-2022-single-building"
  modelRevision: "Match engineering_revision in this BIMDown project."
  building:
    id: "Stable building ID"
    parcelId: "Stable parcel ID"
    scope: "whole-residential-building"
    source: "Reviewed boundary and building scope"
  business:
    type: "new-survey"
    measuredOn: "ISO calendar date on or after 2022-07-01"
    source: "Evidence for the business type and applicability of this edition"
  review:
    confirmed: "true to run"
    source: "Review record for boundaries, classification, ownership and coverage"
  frame: "Shared planar frame when any part uses geometry"
  gross: "Measurement with basis building-perimeter and independently reviewed areaM2"
  units: "Array of unique id, ownershipSource and parts"
  deductions: "Array of measurement parts with basis deduction and kind independent-use or non-allocatable"
  common:
    scope: "whole-building"
    source: "Reviewed independent common-property ledger and benefit scope"
    beneficiaryUnitIds: "All and only the unit IDs in the plan"
    parts: "Array of measurement parts with basis common-wall-centerline or outer-half-wall"
measurement:
  id: "Unique across the plan"
  source: "Reviewed survey or drawing reference"
  basis: "Measured meaning. Unit boundary basis is unit-wall-centerline or the explicit unit-usable plus unit-wall-share split."
  areaM2: "Nonnegative raw square metres, used alone when supplied"
  geometry: "Alternatively a level directory and local id identifying a reviewed XY Polygon in <level>/property_boundary.geojson"
  treatment: "Only for balconies. enclosed (balcony-perimeter), open-eligible (balcony-eligible-footprint), or excluded."
geometry:
  collection: "GeoJSON FeatureCollection with modelRevision matching the plan"
  requiredProperties: "id, frame, boundary_basis, reviewed=true, source"
  coordinates: "Project units and a shared frame. Closed outer ring followed by holes."
related_report:
  file: property-model-evidence.json
  status: candidate-only
  description: "Read-only model evidence inventory. Only the reviewed property_area.json is an allocation input."
  version: 1
  modelRevision: "BIMDown engineering_revision if present"
  unit: "m2 for area fields and m for elevationM"
  levels: "Exported datum scope, role hint, other levels at the same elevation, surface and opening references, room coverage and diagnostics"
  projectedAreaM2: "Same-level union of valid slab and roof polygons, retaining their existing holes"
  netProjectionM2: "Union after cutting polygon openings from their unique same-level hosts"
  rooms: "Per-level saved and derived outline IDs, room records, areas, source paths and diagnostics"
  roomOutlineCoordinates: "Report polygons and seedM are in metres. Derived candidates use wall centre lines. Saved boundaries carry the declared basis or an unknown status."
boundary_review:
  file: property-boundary-review.json
  format: bimdown.property-boundary-review
  version: 1
  coordinateUnit: m
  description: "Room-level candidate review for the web editor. This file is independent of the approved allocation input."
  records: "Scoped floor and room identifiers, export revision, SHA-256 fingerprint of the floor candidates and assignment groups, group, decision, and review source."
  decisions: "keep, adjust, defer. Defer has no reviewed polygon or area."
  geometry: "Original outline, source path and derived boundary files, plus the reviewed outline and computed area when available."
  propertyUse: "Optional candidate use review on a saved valid outline. Stores kind (private, allocatable, non-allocatable or independent-use), building, scope (whole-building, selected-units or none), recipients or private owner, the known building unit roster, and the review source."
building_ledger_report:
  file: property-building-ledger.json
  format: bimdown.property-building-ledger
  version: 1
  unit: m2
  scope: "One building, explicitly selected natural floors with candidate snapshot hashes, and confirmation of room inventory coverage."
  gross: "Positive separately measured building gross area and its review source, or null when missing."
  rows: "Accepted candidate room reviews keyed by floor and room identifier, including the reviewed polygon, area, use, recipients and provenance."
  result: "Pending, conflict or balanced, with review issues, unit subtotals and category totals. Comparison is performed after independent accumulation and rounding to 0.01 m²."
  use: "Web candidate reconciliation report. The approved allocation input remains property_area.json."
