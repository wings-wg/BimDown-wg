name: engineering_evidence
description: >
  Optional engineering_evidence.json at the project root. It carries measurements,
  object-specific applicability and optional unreviewed source observations.
  BIMDown object and geometry files remain the source of object bindings.
version: 1
fields:
  - name: version
    type: integer
    required: true
    value: 1
  - name: modelRevision
    type: string
    required: true
    description: Match engineering_revision in project_metadata.json from the same export.
  - name: measurements
    type: array
    required: true
    description: Unique per object and concept. Unconfirmed measurements never satisfy an input.
    items:
      object: { scope: "level directory", table: "BIMDown table", id: "table-local object ID" }
      concept: "exact input concept printed by the tool"
      value: "finite number"
      unit: "m or mm"
      source: "measurement or reviewed drawing reference"
      confirmed: "boolean"
      measurementGroup: "same point and vertical datum for operands of a difference, or same reviewed portion for paired window evidence"
      windowSillBasis: "finished-floor or walkable-surface, required for concept window.sill-clear-height"
  - name: sourceRevision
    type: object
    required: false
    description: Revit source context captured before export transactions. A saved version alone does not identify unsaved content.
    fields:
      versionGuid: "Revit DocumentVersion GUID when available"
      numberOfSaves: "Revit DocumentVersion save counter when available"
      hadUnsavedChanges: "whether the Revit document was modified before export"
  - name: planarFrame
    type: string
    required: false
    description: Coordinate frame of automatically exported room geometries, e.g. revit-host-internal-xy.
  - name: roomExport
    type: object
    required: false
    description: >
      Coverage audit for the host document. Separates export selection, rooms found and
      placed, positive area, written rows, level binding and footprints. MEP Spaces and
      links are counted separately. This does not confirm room use or measurement.
    fields:
      status: "disabled, no-host-rooms, no-placed-rooms, no-csv-rows, no-positive-area, missing-level-scope, no-footprints, partial or complete"
      roomTableRequested: "boolean"
      levelTableRequested: "boolean"
      hostRooms: "non-negative count"
      placedRooms: "non-negative count"
      roomsWithPositiveArea: "non-negative count"
      csvRows: "non-negative count"
      rowsWithLevel: "non-negative count"
      footprints: "non-negative count"
      mepSpaces: "non-negative count"
      linkInstances: "non-negative count"
  - name: observations
    type: array
    required: false
    description: Unreviewed Revit facts and extraction diagnostics. They never satisfy measurements or rule applicability.
    items:
      object: { scope: "exported directory (global for levels)", table: "BIMDown table", id: "table-local object ID" }
      revitUniqueId: "UniqueId in the source host document"
      modelFacts: "observed values and source API, specific to the table"
      reviewRequired: "open confirmations and extraction diagnostics"
  - name: applicability
    type: array
    required: true
    description: Unique per object, rule ID, rule version and applicability text.
    items:
      object: { scope: "level directory", table: "BIMDown table", id: "table-local object ID" }
      ruleId: "rule identifier"
      ruleVersion: "rule version shown in the report"
      applicability: "exact applicability text of the reviewed rule"
      decision: "applies or does-not-apply"
      source: "reason and source for the explicit decision"
      windowKind: "ordinary, full-height, or bay, required for applies on window-sill-protection"
      dwellingCountBasis:
        required: "for applies on a project-level dwelling-count-minimum rule"
        source: "reviewed applicable regulation or approved project requirement, including local requirements where applicable"
        minimumCount: "non-negative integer confirmed for this project"
        minimumFraction: { numerator: "positive integer", denominator: "positive integer greater than or equal to the numerator" }
        description: >
          Use object scope global, table project, and id equal to project_metadata.project_number.
          The confirmed figures must agree with the reviewed rule for a conclusive result.
  - name: dwellingInventory
    type: object
    required: false
    description: >
      Reviewed inventory of individual dwellings for the entire residential project.
      A model of one building or a provisional grouping is insufficient for a project-wide count.
      The distinct number of records must equal the independently confirmed total.
    fields:
      projectId: "same identifier as project_metadata.project_number"
      scope: "whole-residential-project"
      complete: "boolean, true only after confirming that all dwellings in scope are listed"
      expectedCount: "positive independently confirmed project dwelling count"
      scopeSource: "approved project boundary or reviewed coverage reference"
      countSource: "independent source of the total count"
      dwellings:
        description: "Up to 20,000 rows, unique by building and dwelling ID."
        items:
          building: "building identifier"
          id: "dwelling identifier within its building"
          accessible: "boolean, or null when eligibility is unresolved"
          confirmed: "boolean"
          source: "reviewed eligibility source, required for a confirmed classification"
  - name: windowGuards
    type: array
    required: false
    description: >
      One reviewed protection record per scoped exterior window. The conditional rule binds
      window.sill-clear-height, the minimum across the applicable opening, in metres or
      millimetres from the finished interior floor
      for ordinary and full-height windows, and from the confirmed walkable surface for bay
      windows. Only windows strictly below the rule limit require this protection record.
    items:
      object: { scope: "level directory", table: "window", id: "window ID" }
      provided: "boolean, true when protection is confirmed across the required portions, false when an applicable portion is confirmed unprotected"
      location: "same reference as the sill measurementGroup"
      source: "reviewed detail, analysis or inspection source"
      confirmed: "boolean"
  - name: doorUses
    type: array
    required: false
    description: At most one confirmed use and measurement setup per scoped door. The width itself is a measurement with concept door.effective-clear-width.
    items:
      object: { scope: "level directory", table: "door", id: "door ID" }
      use: "entrance, habitable, kitchen or bathroom"
      source: "reviewed door use and measurement setup, including leaf, frame and hardware intrusions"
      confirmed: "boolean"
      openingAngleDeg: "finite degrees, greater than 0 and at most 180"
      measurementLine: "reference to the actual clear-passage measurement line"
  - name: stairHeadroomCoverage
    type: array
    required: false
    description: >
      Unique per physical stair flight or landing. The confirmed assessment covers the full
      applicable walking area and identifies the point of minimum vertical headroom.
      Bind to a reviewed measurement with the same scoped object and location as measurementGroup.
      Use concept stair.flight-minimum-headroom for stair and stair_run, and
      stair.landing-minimum-headroom for stair_landing. A stair row used only as a
      container requires a reviewed does-not-apply record. Repeated instances require
      separate physical component rows and confirmations.
    items:
      object: { scope: "level directory", table: "stair, stair_run or stair_landing", id: "component ID" }
      location: "reviewed minimum headroom point or section reference"
      coversStructure: "boolean, confirms coverage of the applicable structural restrictions"
      coversServices: "boolean, confirms coverage of applicable ducts and other services"
      source: "reviewed analysis or drawing identifying the scope and limiting obstructions"
      confirmed: "boolean"
  - name: clearHeightAreas
    type: array
    required: false
    description: One confirmed record per scoped space and belowHeightMetres. Whole and low areas use the same finished usable-floor boundary. Minimum height is a measurement with concept space.finished-minimum-clear-height.
    items:
      object: { scope: "level directory", table: "space", id: "room ID" }
      belowHeightMetres: "constant height in metres, exclusive upper bound for the low area"
      usableAreaM2: "finite total usable-floor area in square metres"
      lowAreaM2: "finite part of that area strictly below the height limit, in square metres"
      boundaryRef: "reference to the single reviewed usable-floor boundary shared by both areas"
      source: "reviewed analysis or drawing"
      confirmed: "boolean"
  - name: spaceRelations
    type: object
    required: false
    description: Confirmed lower-storey inventory, room use and coordinate frame for cross-storey projection checks. Rings are read from each level's space.geojson and matched to space.csv.
    levelPairs:
      - upper: "upper level directory"
        lower: "reviewed lower level directory with a smaller elevation"
        frame: "common planar coordinate frame"
        source: "review of the pairing and completeness of the lower room list"
        lowerInventoryConfirmed: "true"
    footprints:
      - object: { scope: "level directory", table: "space", id: "room ID" }
        use: "bathroom, bedroom, living, kitchen, dining or other"
        frame: "same planar reference as the selected level pair"
        source: "room use and geometry confirmation"
        confirmed: "boolean"
